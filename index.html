<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Medi vault — Advanced Patient Health & Medical Management Dashboard" />
    <meta name="theme-color" content="#4f46e5" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <title>Medi vault</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          // Register background Local Alarm SW
          navigator.serviceWorker.register('/sw.js', { scope: '/' })
            .then(reg => console.log('[PWA] sw.js registered successfully scope:', reg.scope))
            .catch(err => console.error('[PWA] sw.js registration failed:', err));

          // Register Firebase Cloud Messaging SW
          navigator.serviceWorker.register('/firebase-messaging-sw.js', { scope: '/' })
            .then(reg => console.log('[PWA] firebase-messaging-sw.js registered successfully scope:', reg.scope))
            .catch(err => console.error('[PWA] firebase-messaging-sw.js registration failed:', err));
        });
      }
    </script>
  </body>
</html>
